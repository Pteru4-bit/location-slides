<style>
:root { --ink: #22303c; --muted: #6b7a88; --line: #e3e8ee; --bg: #f4f6f8; --card: #fff; --red: #c00000; --blue: #1e63d8; --warn: #b26a00; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.4 Arial, Helvetica, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; min-height: 100vh; }
#top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; font-size: 16px; color: var(--red); }
.who { color: var(--muted); flex: 1; font-size: 12.5px; }
#main { display: flex; flex: 1; min-height: 0; }
#list { width: 340px; flex: none; border-right: 1px solid var(--line); background: #fff; display: flex; flex-direction: column; }
.listbar { padding: 10px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.listbar input[type=search] { flex: 1; min-width: 0; }
.chk { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; gap: 4px; align-items: center; }
.rows { overflow: auto; flex: 1; }
.row { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: #f7f9fb; }
.row.on { background: #eaf1fd; }
.row .t { font-weight: 700; }
.row .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #e8f5e9; color: #2e7d32; margin-left: 6px; }
.badge.no { background: #f1f3f5; color: var(--muted); }
.badge.rej { background: #fdecea; color: #b71c1c; }
#wiz { flex: 1; overflow: auto; padding: 16px 20px 40px; }
.empty { padding: 60px 20px; text-align: center; }
.empty .big { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.head { margin-bottom: 12px; }
.h1 { font-size: 22px; font-weight: 700; }
.meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.meta.warn { color: var(--warn); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.ct { font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.ct.sub { margin-top: 12px; font-weight: 600; font-size: 13px; }
.ct .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.grid4 { display: grid; grid-template-columns: 2fr 1fr 1.2fr 1fr; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
label small { font-size: 11px; }
input[type=text], input[type=search], select { font: 14px Arial, sans-serif; padding: 7px 9px; border: 1px solid #cfd6de; border-radius: 7px; color: var(--ink); background: #fff; width: 100%; }
input[readonly] { background: #f7f9fb; }
input:focus, select:focus { outline: 2px solid #9cc0f5; border-color: #9cc0f5; }
.hint { font-size: 12.5px; color: var(--warn); margin-top: 6px; }
.hint.ok { color: #2e7d32; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pad { padding: 12px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
/* Мініатюра показує фото ЦІЛКОМ (contain, без обрізання країв): людина
   обирає, що піде на слайд, і має бачити весь кадр. Обрізання під слот
   робиться вже на слайді. */
.th { position: relative; width: 200px; height: 150px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; background: #dfe4ea; cursor: pointer; }
.th img { width: 100%; height: 100%; object-fit: contain; display: block; }
.th.on { border-color: var(--blue); box-shadow: 0 0 0 2px #cfe0fb; }
.th .n { position: absolute; left: 6px; top: 6px; background: var(--blue); color: #fff; font-weight: 700; font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: none; align-items: center; justify-content: center; }
.th.on .n { display: flex; }
.th .mv { position: absolute; right: 4px; top: 4px; display: none; gap: 2px; }
.th.on .mv { display: flex; }
.th .mv button { width: 22px; height: 22px; border: none; border-radius: 4px; background: rgba(255,255,255,.9); cursor: pointer; font-size: 12px; }
.th .cap { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 10.5px; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th.err { border-color: #e57373; }
.th.err .cap { background: rgba(192,0,0,.75); }
.th.none { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12.5px; }
.coords { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.coords label { width: 130px; }
.btn { font: 13px Arial, sans-serif; padding: 7px 12px; border-radius: 7px; border: 1px solid #cfd6de; background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap; }
.btn:hover { background: #f2f5f8; }
.btn.ghost { border-color: #cfd6de; }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; padding: 10px 18px; font-size: 14px; }
.btn.primary:hover { background: #a80000; }
.btn.primary[disabled] { opacity: .6; cursor: default; }
.btn.small { padding: 4px 8px; font-size: 12px; }
.btn.file { position: relative; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.deckrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.deckrow select { max-width: 460px; }
.lnk { color: var(--blue); font-size: 12.5px; }
.actions { display: flex; gap: 12px; align-items: center; margin-top: 6px; }
.result { margin-top: 10px; padding: 12px 14px; border-radius: 10px; background: #e8f5e9; color: #1b5e20; }
.result.err { background: #fdecea; color: #b71c1c; }
.result a { color: inherit; font-weight: 700; }
#foot { padding: 8px 16px; border-top: 1px solid var(--line); background: #fff; font-size: 12px; }
#foot a { color: var(--muted); }
#cols { font: 11.5px/1.5 monospace; color: var(--muted); white-space: pre-wrap; margin: 6px 0 0; }
@media (max-width: 900px) {
  #main { flex-direction: column; }
  #list { width: auto; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--line); }
  .grid4, .grid2 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 520px) { .grid4, .grid2 { grid-template-columns: 1fr; } }
</style>
