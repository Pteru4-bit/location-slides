<script>
(function () {
  'use strict';

  var BOOT = window.__BOOT || { email: '', mapUrl: '', key: '', shotZoom: 15, photoMax: 20 };
  var GAS = !!(window.google && window.google.script && window.google.script.run);
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ── Адаптер: у Apps Script — google.script.run; офлайн (тести) — window.__TEST_API ── */
  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (GAS) {
        var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e instanceof Error ? e : new Error((e && e.message) || String(e))); });
        r[name].apply(r, args);
      } else if (window.__TEST_API && typeof window.__TEST_API[name] === 'function') {
        try { Promise.resolve(window.__TEST_API[name].apply(null, args)).then(resolve, reject); } catch (e) { reject(e); }
      } else reject(new Error('Офлайн: немає API ' + name));
    });
  }

  /* ── Стан ── */
  var ROWS = [], SEL = {}, DECKS = [], RUNNING = false, STOP = false;
  $('who').textContent = BOOT.email || '';
  if ($('ver')) $('ver').textContent = BOOT.version ? 'версія ' + BOOT.version : '';

  function selectedRows() { return ROWS.filter(function (r) { return SEL[r.key]; }); }
  function updateSel() {
    var n = selectedRows().length;
    $('selCount').textContent = n;
    $('build').textContent = n ? 'Створити слайди (' + n + ')' : 'Створити слайди';
    $('build').disabled = RUNNING || !n;
  }

  /* Посилання «карта ↗»: карта мережі на локації, якщо координати вже відомі
     (збережені або з посилання Google Maps у заявці), інакше просто з ключем. */
  function mapLink(r) {
    if (!BOOT.mapUrl) return '';
    var u = BOOT.mapUrl + (BOOT.mapUrl.indexOf('?') === -1 ? '?' : '&') + 'slide=' + encodeURIComponent(r.key);
    var m = String(r.coordsSaved || '').match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/) ||
            String(r.mapLink || '').match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);
    if (m) u += '&ll=' + m[1] + ',' + m[2] + '&z=' + BOOT.shotZoom;
    var addr = String(r.address || '').replace(/[\s,;]+$/, '');
    u += '&label=' + encodeURIComponent([addr, r.city].filter(Boolean).join(', '));
    return u;
  }

  /* ── Список заявок ── */
  function loadRows() {
    $('rows').innerHTML = '<div class="muted pad">Завантаження заявок…</div>';
    return api('apiListRows').then(function (res) {
      ROWS = res.rows || [];
      Object.keys(SEL).forEach(function (k) { if (!ROWS.some(function (r) { return r.key === k; })) delete SEL[k]; });
      renderRows(); updateSel();
    }).catch(function (e) { $('rows').innerHTML = '<div class="pad" style="color:#b71c1c">' + esc(e.message) + '</div>'; });
  }
  function visibleRows() {
    var q = $('q').value.trim().toLowerCase(), onlyNew = $('onlyNew').checked, showRej = $('showRejected').checked;
    return ROWS.filter(function (r) {
      if (onlyNew && r.slideUrl) return false;
      if (!showRej && r.rejected) return false;
      if (!q) return true;
      return [r.city, r.address, r.author, r.objType, r.branch, r.region].join(' ').toLowerCase().indexOf(q) !== -1;
    });
  }
  function renderRows() {
    var html = visibleRows().map(function (r) {
      var ml = mapLink(r);
      return '<div class="row' + (SEL[r.key] ? ' on' : '') + (r.slideUrl ? ' done' : '') + '" data-key="' + esc(r.key) + '">' +
        '<input type="checkbox" ' + (SEL[r.key] ? 'checked' : '') + ' aria-label="відмітити">' +
        '<div class="body"><div class="t">' + esc(r.city) + ', ' + esc(r.address) +
        (r.slideUrl ? '<span class="badge"><a href="' + esc(r.slideUrl) + '" target="_blank" rel="noopener">є слайд ↗</a></span>' : '<span class="badge no">без слайда</span>') +
        (r.rejected ? '<span class="badge rej">не підходить</span>' : '') + '</div>' +
        '<div class="s">' + esc(r.objType || '—') + ' · ' + esc(r.deal || '') + ' · ' + esc(r.date || r.ts) + ' · ' + esc(r.author) +
        ' · фото: ' + (r.photoIds ? r.photoIds.length : 0) +
        (r.priceUah == null && r.priceRaw ? ' · ціна текстом: «' + esc(r.priceRaw.slice(0, 40)) + (r.priceRaw.length > 40 ? '…' : '') + '»' : '') +
        (ml ? ' · <a href="' + esc(ml) + '" target="_blank" rel="noopener" data-nosel="1">карта ↗</a>' : '') +
        '</div></div></div>';
    }).join('');
    $('rows').innerHTML = html || '<div class="muted pad">Нічого не знайдено.</div>';
  }
  $('q').addEventListener('input', renderRows);
  $('onlyNew').addEventListener('change', renderRows);
  $('showRejected').addEventListener('change', renderRows);
  $('reload').addEventListener('click', loadRows);
  $('rows').addEventListener('click', function (e) {
    if (e.target.closest('a')) return;      /* посилання не міняють вибір */
    var el = e.target.closest('.row');
    if (!el || RUNNING) return;
    var key = el.getAttribute('data-key');
    if (SEL[key]) delete SEL[key]; else SEL[key] = true;
    el.classList.toggle('on', !!SEL[key]);
    el.querySelector('input[type=checkbox]').checked = !!SEL[key];
    updateSel();
  });
  $('selVisible').addEventListener('click', function () {
    if (RUNNING) return;
    visibleRows().forEach(function (r) { SEL[r.key] = true; });
    renderRows(); updateSel();
  });
  $('selNone').addEventListener('click', function () {
    if (RUNNING) return;
    SEL = {}; renderRows(); updateSel();
  });

  /* ── Презентації ── */
  function loadDecks() {
    return api('apiListDecks').then(function (res) { DECKS = res.decks || []; renderDecks(); })
      .catch(function (e) { flash('Презентації: ' + e.message); });
  }
  function renderDecks() {
    var sel = $('deck');
    var remembered = '';
    try { remembered = localStorage.getItem('slides.deck') || ''; } catch (e) {}
    sel.innerHTML = DECKS.map(function (d) {
      return '<option value="' + esc(d.id) + '">' + esc(d.name) + ' · ' + d.slides + ' сл. · ' + esc(d.created) + '</option>';
    }).join('') || '<option value="">— створіть презентацію —</option>';
    sel.value = (remembered && DECKS.some(function (d) { return d.id === remembered; })) ? remembered : (DECKS[0] ? DECKS[0].id : '');
    deckChanged();
  }
  function deckChanged() {
    var id = $('deck').value;
    var d = DECKS.filter(function (x) { return x.id === id; })[0];
    var a = $('deckLink');
    if (d) { a.href = d.url; a.style.display = ''; } else a.style.display = 'none';
    try { if (id) localStorage.setItem('slides.deck', id); } catch (e) {}
  }
  $('deck').addEventListener('change', deckChanged);
  $('newDeck').addEventListener('click', function () {
    var name = window.prompt('Назва нової презентації (один розгляд = одна презентація):', 'Локації на розгляд ' + new Date().toLocaleDateString('uk-UA'));
    if (!name) return;
    $('newDeck').disabled = true;
    api('apiCreateDeck', name).then(function (res) {
      DECKS.unshift(res.deck);
      renderDecks();
      $('deck').value = res.deck.id; deckChanged();
      flash('Презентацію створено: ' + res.deck.name);
    }).catch(function (e) { flash(e.message); }).then(function () { $('newDeck').disabled = false; });
  });

  /* ── Пакетне створення: по одній заявці за виклик ── */
  function logLine(cls, html) {
    var d = document.createElement('div');
    d.className = 'li ' + cls;
    d.innerHTML = html;
    $('log').appendChild(d);
    d.scrollIntoView({ block: 'nearest' });
    return d;
  }
  function describe(res) {
    var bits = ['фото: ' + res.photos + (res.skipped ? ' (пропущено ' + res.skipped + ')' : '')];
    bits.push(res.map === 'shot' ? 'карта: знімок із карти мережі' : res.map === 'static' ? 'карта: авто, точок поруч ' + res.mapPoints : 'карти немає');
    bits.push('ціна: ' + res.price);
    return bits.join(' · ');
  }
  function setRunning(on) {
    RUNNING = on; STOP = false;
    $('stop').style.display = on ? '' : 'none';
    $('newDeck').disabled = on; $('deck').disabled = on; $('reload').disabled = on;
    updateSel();
  }
  $('stop').addEventListener('click', function () { STOP = true; $('stop').disabled = true; $('buildMsg').textContent = 'Зупиняю після поточної заявки…'; });

  $('build').addEventListener('click', function () {
    if (RUNNING) return;
    var rows = selectedRows();
    var deckId = $('deck').value;
    if (!rows.length) { flash('Відмітьте хоча б одну заявку.'); return; }
    if (!deckId) { flash('Оберіть або створіть презентацію.'); return; }
    var replace = $('replace').checked;
    var deckName = (DECKS.filter(function (d) { return d.id === deckId; })[0] || {}).name || '';
    var dup = rows.filter(function (r) { return r.slideUrl && r.slideUrl.indexOf('/d/' + deckId + '/') !== -1; });
    if (dup.length && replace && !window.confirm('У презентації «' + deckName + '» уже є слайди для ' + dup.length + ' з відмічених заявок. Замінити їх?')) return;

    setRunning(true);
    $('stop').disabled = false;
    $('progress').style.display = '';
    $('log').innerHTML = '';
    var done = 0, okN = 0, errN = 0, total = rows.length, okKeys = {};
    $('progCount').textContent = '0 з ' + total;
    $('buildMsg').textContent = 'Збираю слайди… кожен 15–60 секунд';

    var next = function () {
      if (STOP || done >= total) { finish(); return; }
      var r = rows[done];
      var line = logLine('run', '⏳ ' + esc(r.city) + ', ' + esc(r.address));
      api('apiBuildSlide', { key: r.key, row: r.row, deckId: deckId, replace: replace }).then(function (res) {
        okN++; okKeys[r.key] = true;
        r.slideUrl = res.slideUrl; r.slideDeck = res.deckName;
        line.className = 'li ok';
        line.innerHTML = '✔ ' + esc(r.city) + ', ' + esc(r.address) + ' — <a href="' + esc(res.slideUrl) + '" target="_blank" rel="noopener">слайд ↗</a>' +
          '<div class="d">' + esc(describe(res)) + (res.notes && res.notes.length ? '<br>' + esc(res.notes.join(' · ')) : '') + '</div>';
      }).catch(function (e) {
        errN++;
        line.className = 'li err';
        line.innerHTML = '✘ ' + esc(r.city) + ', ' + esc(r.address) + ' — ' + esc(e.message);
      }).then(function () {
        done++;
        $('progCount').textContent = done + ' з ' + total;
        next();
      });
    };
    var finish = function () {
      var d = DECKS.filter(function (x) { return x.id === deckId; })[0];
      logLine('ok', '<b>Готово:</b> ' + okN + ' слайдів' + (errN ? ', помилок ' + errN : '') + (STOP && done < total ? ', зупинено' : '') +
        (d ? ' · <a href="' + esc(d.url) + '" target="_blank" rel="noopener">відкрити презентацію «' + esc(d.name) + '» ↗</a>' : ''));
      $('buildMsg').textContent = '';
      /* Знімаємо вибір лише з того, що вдалося: невдалі лишаються відміченими для повтору. */
      rows.forEach(function (r) { if (okKeys[r.key]) delete SEL[r.key]; });
      setRunning(false);
      renderRows(); updateSel(); loadDecks();
    };
    next();
  });

  var flashT = null;
  function flash(text) {
    $('buildMsg').textContent = text;
    clearTimeout(flashT);
    flashT = setTimeout(function () { if (!RUNNING) $('buildMsg').textContent = ''; }, 4000);
  }

  /* ── Колонки форми (діагностика) ── */
  $('colsToggle').addEventListener('click', function (e) {
    e.preventDefault();
    var pre = $('cols');
    if (pre.style.display !== 'none') { pre.style.display = 'none'; return; }
    pre.style.display = ''; pre.textContent = '…';
    api('apiColumnReport').then(function (r) { pre.textContent = (r.lines || []).join('\n'); })
      .catch(function (err) { pre.textContent = err.message; });
  });

  /* ── Старт ── */
  loadDecks();
  loadRows().then(function () {
    if (BOOT.key && ROWS.some(function (r) { return r.key === BOOT.key; })) { SEL[BOOT.key] = true; renderRows(); updateSel(); }
  });

  /* Для тестів. */
  window.__wiz = {
    state: function () { return { rows: ROWS.length, visible: visibleRows().length, sel: Object.keys(SEL), decks: DECKS.length,
      running: RUNNING, build: $('build').textContent, log: $('log').textContent }; }
  };
})();
</script>
